name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install linter
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Build image
        run: docker build -t pushbridge:ci .
